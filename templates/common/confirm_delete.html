{% extends 'common/base.html' %}

{% block content %}
<div class="container my-4 text-white">
    <h2 class="text-danger mb-4">Delete Confirmation</h2>

    <div class="card shadow-sm p-4 mt-3">
        <p class="lead mb-4">Are you sure you want to delete <strong>{{ object }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Confirm Delete</button>
            <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
