{% extends 'common/base.html' %}

{% block content %}
<div class="container text-center mt-5">
    <div class="card bg-dark text-light border-secondary p-5 shadow-lg mx-auto" style="max-width: 600px;">
        <h1 class="display-1 fw-bold text-danger">404</h1>
        <h2 class="mb-3">Page Not Found</h2>
        <p class="text-muted mb-4">
            The page you are looking for doesn't exist, has been removed, or you typed the URL incorrectly.
        </p>
        <div>
            <a href="{% url 'common:home' %}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house-door me-2"></i>Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
